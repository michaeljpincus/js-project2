<!DOCTYPE html>
<html lang="en">

<head>
    <title>Project 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.12.0/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <button id="reset-zoom">Reset Zoom</button>
    <div id="map"></div>
    <div id="map-header">
        <h1 class="map-title">New York College Explorer</h1>
        <select id="college-select" aria-label="Choose a college"></select>
    </div>
    <div id="legend"></div>

    <div id="story">

        <div id="info"></div>

        <div id="filters">

        <div class="filter">
            <label for="price-slider">
                Max net cost: <strong id="price-value"></strong>
            </label>
            <input type="range" id="price-slider">
        </div>

        <div class="filter">
            <label for="earnings-slider">
                Min earnings (10 yrs): <strong id="earnings-value"></strong>
            </label>
            <input type="range" id="earnings-slider">
        </div>

        <div class="filter">
            <label for="accept-slider">
                Max acceptance rate: <strong id="accept-value"></strong>
            </label>
            <input type="range" id="accept-slider">
        </div>

    </div>
        <div id="scatter"></div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
